<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="title">Tic-Tac-Toe</div>
    <div class="setup">

        <div class="names">Write down Your Names:</div>

        <div class="inputs">

            <div class="input">
                <label for="player1">Player X:</label>
                <input type="text" id="player1" name="player1" required>
            </div>

            <div class="input">
                <label for="player2">Player O:</label>
                <input type="text" id="player2" name="player2" required>
            </div>

        </div>


        <button class="start">Play</button>
        
    </div>

    <div class="game hidden">
        <h2 class="activePlayer"></h2>
        <div class="game-container">
            <button class="box" id="b0"></button>
            <button class="box" id="b1"></button>
            <button class="box" id="b2"></button>
            <button class="box" id="b3"></button>
            <button class="box" id="b4"></button>
            <button class="box" id="b5"></button>
            <button class="box" id="b6"></button>
            <button class="box" id="b7"></button>
            <button class="box" id="b8"></button>
        </div>
        <button class="restart">Restart</button>

    </div>
       <div class="dummy-game1">
        <div class="game-container dummy">
            <button class="box" id="db0">x</button>
            <button class="box" id="db1">o</button>
            <button class="box" id="db2"></button>
            <button class="box" id="db3">o</button>
            <button class="box" id="db4">x</button>
            <button class="box" id="db5"></button>
            <button class="box" id="db6"></button>
            <button class="box" id="db7"></button>
            <button class="box" id="db8">x</button>
        </div>
    </div>

           <div class="dummy-game2">
        <div class="game-container dummy">
            <button class="box" id="db0">o</button>
            <button class="box" id="db1">o</button>
            <button class="box" id="db2">o</button>
            <button class="box" id="db3"></button>
            <button class="box" id="db4">x</button>
            <button class="box" id="db5"></button>
            <button class="box" id="db6">x</button>
            <button class="box" id="db7"></button>
            <button class="box" id="db8">x</button>
        </div>
    </div>


    


</body>
</html>
